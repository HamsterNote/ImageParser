name: Publish to npm (tags)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: yarn

      # Tag and package versions must agree before any install/build/publish.
      - name: Validate release tag and classify dist-tag
        shell: bash
        run: node .github/scripts/release-metadata.cjs validate "${GITHUB_REF#refs/tags/}" package.json

      - name: Install dependencies
        run: |
          corepack enable
          yarn --version
          yarn install --frozen-lockfile

      - name: Check if version already published
        id: version
        shell: bash
        run: |
          PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "Package: $PKG_NAME"
          echo "Version: $PKG_VERSION"
          if npm view "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already exists on npm, skip publishing."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION not found on npm, will publish."
          fi

      - name: Verify npm authentication
        if: steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is empty or unavailable in this workflow."
            exit 1
          fi

          echo "Registry: $(npm config get registry)"
          npm whoami

      - name: Build package
        if: steps.version.outputs.should_publish == 'true'
        run: |
          yarn build:all

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --tag "$PUBLISH_TAG" --access public

      - name: Ensure pre-release dist-tag
        if: (env.PUBLISH_TAG == 'dev' || env.PUBLISH_TAG == 'beta') && steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "Ensure dist-tag: ${PUBLISH_TAG} -> $PKG_VERSION"
          npm dist-tag add "$PKG_NAME@$PKG_VERSION" "$PUBLISH_TAG"
          ACTUAL_TAG_VERSION=$(npm view "$PKG_NAME@$PUBLISH_TAG" version 2>/dev/null || echo "")
          if [[ "$ACTUAL_TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::dist-tag ${PUBLISH_TAG} did not resolve to ${PKG_VERSION}, got: ${ACTUAL_TAG_VERSION}"
            exit 1
          fi
          echo "dist-tag ${PUBLISH_TAG} -> ${PKG_VERSION} verified."
          npm dist-tag ls "$PKG_NAME"
